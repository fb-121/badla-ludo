<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#170d16"><meta name="description" content="Truck-art Ludo for siblings who live apart. Get on a call, pick a ride, and take your badla."><meta property="og:title" content="Badla Ludo"><meta property="og:description" content="Truck-art Ludo for siblings who live apart. Get on a call, pick a ride, and take your badla."><meta property="og:type" content="website"><link rel="icon" href="data:,"><style>[hidden]{display:none!important}html,body{margin:0;padding:0}</style><title>Badla Ludo</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Hind:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a lacquered truck-art Ludo board floats in a dark, warm room; four player tags sit at the board's corners, the dock below holds the dice and the banter. Bungee only where it would be hand-painted; Hind for everything you read or tap. */
:root{
  color-scheme: dark;
  --ink:#170d16;
  --panel:#2a1828;
  --panel-2:#3a2236;
  --line:rgba(255,240,214,.16);
  --cream:#fff3dc;
  --dim:#cdb6c6;
  --gold:#f2b440;
  --red:#e0352b;--green:#1fa25a;--yellow:#f5b700;--blue:#2c6fe0;
  --font-display:'Bungee','Impact','Arial Black',sans-serif;
  --font-body:'Hind',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{box-sizing:border-box;height:100%}
body{height:100%;margin:0;background:var(--ink);color:var(--cream);font:16px/1.4 var(--font-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse 90% 60% at 50% 45%,#4a1f36 0%,#2a1123 45%,#140a13 100%)}
.bokeh{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bokeh i{position:absolute;border-radius:50%;filter:blur(18px);opacity:.35}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
h1,h2,h3,p{margin:0}
button{font-family:inherit;touch-action:manipulation}

.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none}
.brand{font:400 .95rem/1 var(--font-display);color:var(--gold);letter-spacing:.02em;text-shadow:2px 2px 0 #7a1d16}
.brand span{font:600 .78rem/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-left:8px;text-shadow:none}
.tools{display:flex;gap:8px;pointer-events:auto}
.icon{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(23,13,22,.6);color:var(--cream);font:600 .84rem/1 var(--font-body);cursor:pointer}

.tag{position:absolute;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(23,13,22,.78);border:1px solid var(--line);max-width:47vw;transition:box-shadow .3s,transform .3s;white-space:nowrap;cursor:pointer;color:var(--cream);font:inherit;text-align:left}
.tag .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 .85rem/1 var(--font-body);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tag .tx{min-width:0}
.tag b{display:block;font:600 .9rem/1.1 var(--font-body);overflow:hidden;text-overflow:ellipsis}
.tag small{display:block;font:500 .72rem/1.15 var(--font-body);color:var(--dim);overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tag small.badla{color:#ffb4a6}
.tag.turn{box-shadow:0 0 0 2px var(--c),0 0 22px var(--c);transform:scale(1.04)}
.bubble{position:absolute;bottom:calc(100% + 6px);left:12px;background:var(--cream);color:var(--ink);font:700 .95rem/1 var(--font-body);padding:7px 11px;border-radius:12px;white-space:nowrap;animation:pop 2.2s ease forwards;pointer-events:none}
.tag.below .bubble{bottom:auto;top:calc(100% + 6px)}
@keyframes pop{0%{transform:scale(.4);opacity:0}10%{transform:scale(1.08);opacity:1}18%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

.dock{position:absolute;left:0;right:0;bottom:0;display:grid;justify-items:center;gap:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.status{font:600 .95rem/1.2 var(--font-body);color:var(--cream);text-align:center;min-height:1.2em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#roll{display:flex;align-items:center;gap:10px;height:58px;padding:0 24px 0 12px;border-radius:999px;border:0;background:linear-gradient(180deg,#ffcb5c,#e9a128);color:#2b1608;font:700 1.1rem/1 var(--font-body);cursor:pointer;box-shadow:0 6px 0 #a8661b,0 12px 24px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s,opacity .2s}
#roll:active{transform:translateY(4px);box-shadow:0 2px 0 #a8661b,0 6px 14px rgba(0,0,0,.4)}
#roll:disabled{opacity:.35;cursor:default;transform:none;box-shadow:0 6px 0 #a8661b}
#roll.ready{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.die{width:36px;height:36px;border-radius:9px;background:#fff6e4;border:2px solid #c8281c;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:4px}
.die span{width:7px;height:7px;border-radius:50%;background:#14756a;place-self:center}
.reacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:min(100%,21rem)}
.react{height:40px;min-width:0;padding:0 8px;white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:rgba(23,13,22,.6);color:var(--cream);font:700 .86rem/1 var(--font-body);cursor:pointer}
.react:disabled{opacity:.35}
.btn{font:700 1rem/1 var(--font-body);min-height:50px;padding:0 22px;border-radius:999px;border:0;background:linear-gradient(180deg,#ffcb5c,#e9a128);color:#2b1608;cursor:pointer;box-shadow:0 5px 0 #a8661b}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:none;border:1.5px solid var(--line)}
.btn.sm{min-height:40px;padding:0 16px;font-size:.92rem}
.btn:focus-visible,.icon:focus-visible,.seat:focus-visible,.react:focus-visible,#roll:focus-visible,input:focus-visible,.seg button:focus-visible,.tag:focus-visible,.chipt:focus-visible{outline:3px solid var(--cream);outline-offset:2px}

/* chit-chat card */
.chat{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(24rem,calc(100% - 28px));background:#fff6e4;color:var(--ink);border-radius:16px;padding:14px 16px;box-shadow:0 14px 34px rgba(0,0,0,.5);display:grid;gap:8px;border:3px solid var(--gold);animation:drop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translate(-50%,-14px) scale(.96);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
.chat .k{font:600 .72rem/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:#a8661b}
.chat p{font:700 1.08rem/1.3 var(--font-body)}
.chat .row{justify-content:flex-end}
.chat .btn{min-height:38px;font-size:.9rem}

/* overlays */
.overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,rgba(20,10,19,0) 0%,rgba(20,10,19,.55) 34%,rgba(20,10,19,.96) 64%);padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.sheet{width:100%;max-width:30rem;display:grid;gap:14px}
.eyebrow{font:600 .76rem/1 var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.title{font:400 clamp(2.6rem,12vw,3.6rem)/.92 var(--font-display);color:var(--gold);text-shadow:3px 3px 0 var(--red),6px 6px 0 #14756a}
.lede{color:var(--cream);opacity:.9;max-width:36ch}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seat{--c:#888;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid transparent;background:var(--panel-2);color:var(--cream);cursor:pointer;min-width:0}
.seat .sw{width:32px;height:32px;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.seat b{display:block;font:700 .95rem/1.1 var(--font-body)}
.seat span span{display:block;font-size:.78rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.mine{border-color:var(--c);background:#4a2b45}
.seat:disabled{cursor:default;opacity:.7}
.opts{display:grid;gap:10px}
.optrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.optrow>span{font-size:.9rem;color:var(--dim)}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--dim);font:600 .86rem/1 var(--font-body);padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--cream);color:var(--ink)}
label.nm{display:grid;gap:6px;font:600 .9rem/1.2 var(--font-body);color:var(--cream)}
label.nm.need input{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,180,64,.25)}
input[type=text]{width:100%;font:500 1rem/1.3 var(--font-body);color:var(--cream);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:11px 12px;-webkit-user-select:text;user-select:text}
.note{color:var(--dim);font-size:.88rem;max-width:60ch}
/* lobby: the board spins on its own stage up top, and everything to read or tap sits on one solid card */
.app.inlobby .top{display:none}
.overlay.lobby{display:block;background:none;padding:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.stage{height:var(--stage)}
.app{--stage:clamp(140px,24vh,330px)}
.card{position:relative;margin:0 auto;max-width:30rem;min-height:calc(100% - var(--stage));gap:16px;background:linear-gradient(180deg,rgba(46,26,44,.97) 0%,#1d1019 70%);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:22px 18px 10px;box-shadow:0 -20px 44px rgba(0,0,0,.5)}
.card::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line)}
.card .hd{display:grid;gap:6px}
.card .title{font-size:clamp(2.2rem,11vw,2.9rem);line-height:1;text-shadow:2px 2px 0 var(--red),4px 4px 0 #14756a}
.card .lede{font-size:.95rem;line-height:1.45;color:var(--dim);opacity:1}
.lbl{display:flex;align-items:center;gap:8px;font:600 .92rem/1.2 var(--font-body);color:var(--cream)}
.lbl i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--ink);font:700 .72rem/1 var(--font-body)}
.grp{display:grid;gap:10px}
.card label.nm{gap:10px}
.optrow{display:grid;grid-template-columns:auto auto;justify-content:space-between;align-items:center;gap:10px}
.optrow .seg{justify-self:end}
.seg button{white-space:nowrap}
.go{display:grid;gap:8px;justify-items:stretch}
.opts2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px}
.opt{display:grid;gap:6px;min-width:0}
.opt>span{font-size:.82rem;color:var(--dim)}
.opt .seg button{flex:1;padding:9px 6px}
#recBtn{margin-bottom:calc(env(safe-area-inset-bottom,0px))}
.go .note{text-align:center;justify-self:center;font-size:.85rem;line-height:1.3}
#startBtn{width:100%;min-height:56px;font-size:1.08rem}
.linkbtn{justify-self:center;background:none;border:0;color:var(--dim);font:600 .9rem/1 var(--font-body);text-decoration:underline;text-underline-offset:4px;padding:10px;cursor:pointer}
.linkbtn:focus-visible{outline:3px solid var(--cream);outline-offset:2px;border-radius:8px}
.seat.taken{background:#2f1c2c}
.seat.armed{border-color:var(--gold);background:#4a2b45}
.seat.armed span span{color:var(--gold)}

@media (min-width:640px){.card{border-radius:26px;border-bottom:1px solid var(--line);min-height:0;margin-bottom:28px}.card::before{display:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lobbyrow{display:flex;gap:10px}
.lobbyrow .btn:first-child{flex:1}
.win{align-items:center;background:radial-gradient(ellipse at center,rgba(20,10,19,.86),rgba(20,10,19,.97))}
.win .sheet{text-align:center;justify-items:center}
.win .title{font-size:clamp(2.4rem,11vw,3.4rem)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.chipt{border:1.5px solid var(--line);background:var(--panel-2);color:var(--cream);font:600 .84rem/1.2 var(--font-body);padding:8px 10px;border-radius:12px;cursor:pointer;text-align:left}
.chipt.on{border-color:var(--gold);background:#4a2b45}
.crowned{font:700 1.15rem/1.3 var(--font-body);color:var(--gold)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.menu{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:grid;gap:4px;min-width:230px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu button{text-align:left;border:0;background:transparent;color:var(--cream);font:600 .92rem/1.2 var(--font-body);padding:10px 12px;border-radius:10px;cursor:pointer}
.menu button:hover{background:var(--panel-2)}
.menu button.danger{color:#ff9a8a}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,8,14,.7);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal .box{width:100%;max-width:26rem;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text}
.modal h3{font:400 1.3rem/1.1 var(--font-display);color:var(--gold)}
.rec{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.rec th{font:600 .7rem/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.rec th:first-child,.rec td:first-child{text-align:left}
.rec td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
.tblwrap{overflow-x:auto}
.who{display:grid;gap:4px;font-size:.86rem;color:var(--dim)}
.who b{color:var(--cream);font-weight:600}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:74px}
.bars div{display:grid;justify-items:center;gap:3px;align-self:end}
.bars i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.bars span{font-size:.72rem;color:var(--dim);font-variant-numeric:tabular-nums}
.ledger{display:grid;gap:14px}
.ledger h4{margin:0 0 6px;font:600 .88rem/1.2 var(--font-body)}

#pin{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;background:var(--cream);color:var(--ink);font:700 .84rem/1 var(--font-body);padding:7px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#pin.ko{background:#ff5a4a;color:#fff}
#pin.home{background:#6be0a3}
#pin.safe{background:var(--gold)}
#fx{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(ellipse at center,rgba(224,53,43,0) 40%,rgba(224,53,43,.4) 100%)}
#fx.on{display:flex}
#fx span{font:400 clamp(3rem,16vw,7rem)/1 var(--font-display);color:var(--cream);text-shadow:4px 4px 0 var(--red),8px 8px 0 #14756a}
#fx.on span{animation:punch .45s ease-out 3}
@keyframes punch{0%{transform:scale(.5);opacity:0}25%{opacity:1}100%{transform:scale(1.18);opacity:.9}}
#toast{position:absolute;left:0;right:0;bottom:calc(200px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;padding-left:16px;padding-right:16px}
#toast div{max-width:26rem;background:var(--cream);color:var(--ink);font-weight:600;border-radius:12px;padding:9px 14px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;text-align:center}
#toast div.on{opacity:1;transform:none}
#fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--ink)}
@media (prefers-reduced-motion:reduce){#fx.on span,#roll.ready,.bubble,.confetti i,.chat{animation:none}}
</style>

<div class="app" id="app">
  <div class="bokeh" id="bokeh"></div>
  <canvas id="gl"></canvas>
  <header class="top">
    <div class="brand">Badla<span>Ludo</span></div>
    <div class="tools"><button class="icon" id="mute" aria-pressed="false">Sound on</button><button class="icon" id="menuBtn" aria-expanded="false">Menu</button></div>
  </header>
  <div id="tags"></div>
  <div id="pin" hidden></div>
  <div class="dock" id="dock" hidden>
    <div class="status" id="status" role="status"></div>
    <button id="roll" disabled><span class="die" id="dieIcon"></span><span id="rollTxt">Roll</span></button>
    <button class="btn ghost sm" id="skip" hidden>Skip</button>
    <div class="reacts" id="reacts"></div>
  </div>
  <div class="chat" id="chat" hidden role="dialog" aria-label="Chit-chat">
    <span class="k" id="chatK">Chit-chat</span>
    <p id="chatQ"></p>
    <div class="row"><button class="btn sm" id="chatDone">Answered</button></div>
  </div>
  <div class="menu" id="menu" hidden>
    <button id="mRecord">Family record and dice ledger</button>
    <button id="mRename">Change my name</button>
    <button id="mEnd" class="danger">End this game for everyone</button>
    <button id="mClose">Close</button>
  </div>

  <div class="overlay lobby" id="lobby">
    <div class="stage" id="lobbyStage" aria-hidden="true"></div>
    <div class="sheet card">
      <header class="hd">
        <h1 class="title">Badla Ludo</h1>
        <p class="lede">Ludo like back home, except everyone drives.</p>
      </header>
      <label class="nm" id="nmLabel" for="nameIn"><span class="lbl"><i>1</i>Your name</span>
        <input type="text" id="nameIn" maxlength="18" autocomplete="off" autocapitalize="words" placeholder="What your siblings call you">
      </label>
      <div class="grp"><span class="lbl"><i>2</i>Pick your ride</span><div class="seats" id="seats"></div></div>
      <div class="opts2">
        <div class="opt"><span>Pieces each</span><div class="seg" id="segMode" role="group" aria-label="Pieces each"><button data-m="2" class="on">2 quick</button><button data-m="4">4 classic</button></div></div>
        <div class="opt"><span>Empty seats</span><div class="seg" id="segBots" role="group" aria-label="Empty seats"><button data-b="1" class="on">Computer</button><button data-b="0">Nobody</button></div></div>
      </div>
      <div class="go">
        <p class="note" id="lobbyNote" role="status"></p>
        <button class="btn" id="startBtn" disabled>Start the game</button>
      </div>
      <button class="linkbtn" id="recBtn">Family record and dice ledger</button>
    </div>
  </div>

  <div class="overlay win" id="win" hidden>
    <div class="confetti" id="confetti"></div>
    <div class="sheet" id="winSheet"></div>
  </div>

  <div class="modal" id="recModal" hidden><div class="box" id="recBox" role="dialog" aria-label="Family record"></div></div>
  <div class="modal" id="nameModal" hidden>
    <div class="box" role="dialog" aria-label="Rename">
      <h3 id="nmTitle">Your name</h3>
      <input type="text" id="nmInput" maxlength="18" autocomplete="off">
      <div class="row"><button class="btn ghost sm" id="nmCancel">Cancel</button><button class="btn sm" id="nmSave">Save</button></div>
    </div>
  </div>

  <div id="fx"><span id="fxTxt">HAIN?!</span></div>
  <div id="toast"><div id="toastIn" role="status"></div></div>
  <div id="fail"><p>This game needs WebGL. Try Chrome or Safari on your phone.</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){

function absOf(color,p){return (START[color]+p)%52;}
function legal(st,color,d){
  const out=[];const toks=st.tokens[color];
  for(let i=0;i<toks.length;i++){const p=toks[i];if(p===-1){if(d===6)out.push(i);}else if(p<56&&p+d<=56)out.push(i);}
  return out;
}
/* a sibling who stepped away is driven by the computer until their phone comes back */
const auto=p=>!!(p&&(p.bot||p.away));
function nextColor(st,color){
  const o=st.order;const i=o.indexOf(color);
  for(let k=1;k<=o.length;k++){const c=o[(i+k)%o.length];if(!st.finished||st.finished.indexOf(c)<0)return c;}
  return color;
}
function applyMove(st,color,i,d){
  const s=JSON.parse(JSON.stringify(st));
  s.grudge=s.grudge||{};
  const from=s.tokens[color][i];
  const to=from===-1?0:from+d;
  s.tokens[color][i]=to;
  const caps=[];
  if(to<=50){
    const a=absOf(color,to);
    if(!SAFE.has(a)){
      s.order.forEach(o=>{if(o===color)return;s.tokens[o].forEach((p,j)=>{if(p>=0&&p<=50&&absOf(o,p)===a){s.tokens[o][j]=-1;caps.push([o,j,p]);}});});
    }
  }
  // Badla: knocking out the colour that last knocked you frees one of your pieces from base
  let revenge=false,freed=-1;
  caps.forEach(c=>{if(s.grudge[color]===c[0]){revenge=true;delete s.grudge[color];}s.grudge[c[0]]=color;});
  if(revenge){freed=s.tokens[color].indexOf(-1);if(freed>=0)s.tokens[color][freed]=0;}
  const home=to===56;
  s.last={kind:'move',color:color,token:i,from:from,to:to,caps:caps,home:home,revenge:revenge,freed:freed};
  // chit-chat: a human landing on a star sometimes draws a prompt for the call
  if(to<=50&&STARS.has(absOf(color,to))&&!auto(s.players[color])&&rand01()<.6){
    s.chat={n:(s.chat?s.chat.n:0)+1,idx:Math.floor(rand01()*PROMPTS.length),color:color};
  }
  if(s.tokens[color].every(p=>p===56)){
    s.finished=(s.finished||[]).concat([color]);
    s.status='done';s.winner=color;s.phase='roll';s.endedAt=Date.now();
    return s;
  }
  const bonus=d===6||caps.length>0||home;
  if(bonus){s.turn=color;}else{s.turn=nextColor(s,color);s.sixes=0;}
  s.phase='roll';
  return s;
}
function applyRoll(st,color,d){
  const s=JSON.parse(JSON.stringify(st));
  s.dice=d;s.rollSeq=(s.rollSeq||0)+1;
  s.ledger=s.ledger||{};s.ledger[color]=s.ledger[color]||[0,0,0,0,0,0];s.ledger[color][d-1]++;
  const sixes=d===6?(s.sixes||0)+1:0;
  if(sixes>=3){s.last={kind:'sixes',color:color,value:d};s.turn=nextColor(s,color);s.sixes=0;s.phase='roll';return s;}
  s.sixes=sixes;s.phase='move';s.last={kind:'roll',color:color,value:d};
  return s;
}
function applyPass(st,color){
  const s=JSON.parse(JSON.stringify(st));
  s.last={kind:'pass',color:color,value:s.dice};s.turn=nextColor(s,color);s.sixes=0;s.phase='roll';return s;
}
function botPick(st,color,moves,d){
  let best=moves[0],bestScore=-1e9;const gr=st.grudge||{};
  moves.forEach(i=>{
    const p=st.tokens[color][i],to=p===-1?0:p+d;let sc=0;
    if(p===-1)sc+=40;
    if(to===56)sc+=60;
    if(to>50&&p<=50)sc+=25;
    if(to<=50){
      const a=absOf(color,to);
      if(!SAFE.has(a))st.order.forEach(o=>{if(o!==color)st.tokens[o].forEach(q=>{if(q>=0&&q<=50&&absOf(o,q)===a)sc+=80+(gr[color]===o?40:0);});});

      st.order.forEach(o=>{if(o===color)return;st.tokens[o].forEach(q=>{if(q<0||q>50)return;const dist=(a-absOf(o,q)+52)%52;if(dist>=1&&dist<=6&&!SAFE.has(a))sc-=30;});});
    }
    sc+=to*.5+rand01()*4;
    if(sc>bestScore){bestScore=sc;best=i;}
  });
  return best;
}

  if(!moves.length){schedule(1100,()=>commit(applyPass(G,col)));return;}
  if(bot){schedule(650,()=>doMove(botPick(G,col,moves,G.dice)));return;}
  const spots=new Set(moves.map(i=>G.tokens[col][i]));
  if(spots.size===1)schedule(500,()=>doMove(moves[0]));
}
function afterAnim(){if(!animating){refreshUI();engine();}}

/* ================= reacting to new state ================= */
function onGame(){
  const st=G;
  if(sel!==null&&st.seq!==lastSeq){sel=null;preview.visible=false;$('pin').hidden=true;}
  if(st.status==='playing'||st.status==='done'){
    ensureTokens(st);
    const mc=myColor();boardRotTarget=ROT[mc||'blue'];
    const L=layout(st);
    if(!shown||lastSeq===null||st.seq<lastSeq||!sameShape(shown,st.tokens)){
      ORDER.forEach(c=>{(st.tokens[c]||[]).forEach((p,i)=>{const t=tokens[c][i];t.position.copy(g2w(L[c][i][0],L[c][i][1]));setHeading(t,headingAt(c,p,i));});});
    }else if(st.seq!==lastSeq){
      const lm=st.last||{};
      const steps=lm.kind==='move'?Math.max(1,lm.to-(lm.from<0?-1:lm.from)):0;
      ORDER.forEach(c=>{(st.tokens[c]||[]).forEach((p,i)=>{
        const t=tokens[c][i],old=shown[c][i];
        const isMover=lm.kind==='move'&&lm.color===c&&lm.token===i;
        if(isMover&&p!==old){
          const pts=[];if(old===-1)pts.push(cellOf(c,0,i));else for(let q=old+1;q<=p;q++)pts.push(cellOf(c,q,i));
          pts[pts.length-1]=L[c][i];
          drive(t,pts,()=>{if(lm.home)sfx.home();t.userData.heading=headingAt(c,p,i);const h0=t.rotation.y,h1=t.userData.heading;tween(200,f=>{t.rotation.y=angLerp(h0,h1,f);});});
        }else if(p===-1&&old!==-1){
          flyHome(t,L[c][i],headingAt(c,-1,i),steps*165);
        }else if(p!==old||t.position.distanceTo(g2w(L[c][i][0],L[c][i][1]))>.01){
          const w=g2w(L[c][i][0],L[c][i][1]),a=t.position.clone(),h0=t.rotation.y,h1=headingAt(c,p,i),delay=(p!==old)?steps*165+400:0;
          animating++;setTimeout(()=>tween(320,f=>{t.position.lerpVectors(a,w,ease(f));t.position.y=TOP+Math.sin(f*Math.PI)*(p!==old?1.2:0);t.rotation.y=angLerp(h0,h1,f);},()=>{t.userData.heading=h1;animating--;afterAnim();}),delay);
        }
      });});
      if(lm.kind==='move'&&lm.caps&&lm.caps.length){
        setTimeout(()=>{
          if(lm.revenge){sfx.badla();drama('BADLA!');toast(nameOfColor(lm.color)+(nameOfColor(lm.color)==='You'?' got':' got')+' revenge'+(lm.freed>=0?' and a free ride out of base.':'.'));}
          else{sfx.capture();drama('HAIN?!');const v=lm.caps.map(x=>nameOfColor(x[0]));toast(nameOfColor(lm.color)+' knocked '+(v.indexOf('You')>=0?'you':v.join(' and '))+' home.'+(v.indexOf('You')>=0?' Badla is now on.':''));}
        },steps*165);
      }
      if(lm.kind==='sixes')toast(nameOfColor(lm.color)+' rolled three sixes. Turn lost.');
      if(lm.kind==='away')toast(nameOfColor(lm.color)==='You'?'You were away, so the computer drove for you.':displayName(lm.color)+' stepped away. The computer is driving for them until they are back.');
      if(lm.kind==='back'&&nameOfColor(lm.color)!=='You')toast(displayName(lm.color)+' is back.');
      if(lm.kind==='pass'&&lm.skipped)toast(nameOfColor(lm.color)==='You'?'Your turn was skipped while you were away.':displayName(lm.color)+'\'s turn was skipped.');
      else if(lm.kind==='pass'&&controls(lm.color)&&!auto(G.players[lm.color]))toast('No move with a '+lm.value+'. Turn passes.');
      if(lm.kind==='move'&&lm.from===-1)setTimeout(()=>sfx.horn(),200);
      recordStats(st,lm);
    }
    if(st.rollSeq!==lastRollSeq&&lastRollSeq!==null&&st.last&&(st.last.kind==='roll'||st.last.kind==='sixes'))rollDiceAnim(st.dice,st.last.color);
    else if(lastRollSeq===null&&st.dice)dice.quaternion.copy(faceUpQuat(st.dice));
    lastRollSeq=st.rollSeq||0;
    // chit-chat card
    const cn=st.chat?st.chat.n:0;
    if(lastChat!==null&&cn!==lastChat&&st.chat){setTimeout(()=>showChat(st.chat),900);}
    lastChat=cn;
    shown={};ORDER.forEach(c=>{if(st.tokens[c])shown[c]=st.tokens[c].slice();});
    if(st.seq!==lastSeq&&st.status==='playing'&&st.phase==='roll'&&st.turn===mc&&lastSeq!==null)sfx.turn();
    if(st.status==='done')recordGameEnd(st);
    if(st.status==='playing'&&mc&&st.players[mc].away&&reclaimed!==st.gid+':'+st.seq&&online==='live'&&!document.hidden){
      reclaimed=st.gid+':'+st.seq;
      const s2=JSON.parse(JSON.stringify(st));delete s2.players[mc].away;s2.last={kind:'back',color:mc};
      setTimeout(()=>{if(G.seq===st.seq)commit(s2);},600);
      toast('Welcome back. You are driving again.');
    }
    if(st.seq!==lastSeq)changedAt=Date.now();
    lastSeq=st.seq;
  }else{
    lastSeq=null;shown=null;lastRollSeq=null;lastChat=null;$('chat').hidden=true;
    ORDER.forEach(c=>(tokens[c]||[]).forEach(t=>t.visible=false));
  }
  refreshUI();
  engine();
}
function sameShape(a,b){return ORDER.every(c=>((a[c]||[]).length)===((b[c]||[]).length));}

/* ================= rivalry ledger =================
   Each person's own record is written only by their own phone, so nobody overwrites anyone else. */
function myStats(){return STATS[uid]||{name:myName||'Player',games:0,wins:0,kos:0,revenges:0,victims:{},rolls:[0,0,0,0,0,0]};}
let statsT=null,statsDraft=null;
function bumpStats(fn){
  if(online!=='live'||!uid)return;
  const s=statsDraft||JSON.parse(JSON.stringify(myStats()));
  s.victims=s.victims||{};s.rolls=s.rolls||[0,0,0,0,0,0];
  fn(s);s.name=myName||s.name;statsDraft=s;STATS[uid]=s;
  clearTimeout(statsT);statsT=setTimeout(()=>{const d=statsDraft;statsDraft=null;db.doc('stats/'+uid).set(d).catch(()=>{});},800);
}
function recordStats(st,lm){
  const mc=myColor();if(!mc||!lm||lm.color!==mc)return;
  const key=st.gid+':'+st.seq;if(statsDone[key])return;statsDone[key]=1;
  if(lm.kind==='roll'||lm.kind==='sixes')bumpStats(s=>{s.rolls[lm.value-1]++;});
  if(lm.kind==='move'&&lm.caps&&lm.caps.length)bumpStats(s=>{s.kos+=lm.caps.length;if(lm.revenge)s.revenges++;lm.caps.forEach(c=>{const id=idOfColor(c[0]);if(id)s.victims[id]=(s.victims[id]||0)+1;});});
}
function recordGameEnd(st){
  const mc=myColor();if(!mc)return;const key='end:'+st.gid;if(statsDone[key])return;statsDone[key]=1;
  bumpStats(s=>{s.games++;if(st.winner===mc)s.wins++;});
}

function screenCorner(c){const base={red:0,green:1,yellow:2,blue:3}[c];const steps=Math.round(boardRotTarget/(Math.PI/2));return ((base-steps)%4+4)%4;}
const projV=new THREE.Vector3();
let boardRect={l:0,r:0,t:0,b:0};
function measureBoard(){
  let l=1e9,r=-1e9,t=1e9,b=-1e9;
  const spin=!(G.status==='playing'||G.status==='done');
  const pts=spin?Array.from({length:16},(_,k)=>[Math.cos(k*Math.PI/8)*12,Math.sin(k*Math.PI/8)*12]):[[-8.5,-8.5],[8.5,-8.5],[8.5,8.5],[-8.5,8.5]];
  pts.forEach(p=>{projV.set(p[0],TOP,p[1]).project(camera);const x=(projV.x+1)/2*viewW,y=(1-projV.y)/2*viewH;l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);b=Math.max(b,y);});
  boardRect={l:l,r:r,t:t,b:b};
}
function placeTags(){
  measureBoard();
  tagsEl.querySelectorAll('.tag').forEach(el=>{
    const k=screenCorner(el.dataset.c),top=k<2,left=k===0||k===3;
    el.classList.toggle('below',!top);
    el.style.left=left?Math.max(10,boardRect.l)+'px':'auto';
    el.style.right=left?'auto':Math.max(10,viewW-boardRect.r)+'px';
    el.style.top=top?Math.max(48,boardRect.t-48)+'px':(boardRect.b+6)+'px';
  });
}

/* ================= victory lap ================= */
let pickTitle=TITLES[0];
function losersOf(st){return st.order.filter(c=>c!==st.winner&&!st.players[c].bot).map(c=>st.players[c].uid);}
function crownedFor(st){const l=losersOf(st);if(!l.length)return null;const t=TITLES_BY[l[0]];return t&&t.gid===st.gid?t.title:null;}
let winKey='';
function drawWin(){
  const st=G,w=st.winner,mc=myColor(),wp=st.players[w],iWon=w===mc,crowned=crownedFor(st),losers=losersOf(st);
  const key=st.gid+'|'+crowned+'|'+pickTitle+'|'+displayName(w)+'|'+(mc||'');
  if(key===winKey)return;
  const first=winKey.split('|')[0]!==st.gid;winKey=key;
  let h='<p class="eyebrow">'+COL[w].urdu+' · '+esc(COL[w].ride)+'</p><h2 class="title">'+(iWon?'You win!':esc(displayName(w))+' wins')+'</h2>';
  if(!losers.length){h+='<p class="lede">'+(iWon?'Beat the computer. Now beat your siblings.':'The computer wins this one.')+'</p>';}
  else if(crowned){
    h+='<p class="lede">'+(losers.indexOf(uid)>=0?'Your title until the next game:':'Everyone else is now:')+'</p><p class="crowned">'+esc(crowned)+'</p>';
  }else if(iWon||(auto(wp)&&controls(w))){
    if(auto(wp)){setTimeout(()=>crown(TITLES[Math.floor(rand01()*TITLES.length)]),1200);h+='<p class="lede">'+esc(displayName(w))+' is choosing your title...</p>';}
    else{
      h+='<p class="lede">Victory lap. Pick the title everyone else wears until the next game.</p><div class="chips" id="titleChips">'+TITLES.map(t=>'<button class="chipt'+(t===pickTitle?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div><input type="text" id="customTitle" maxlength="40" placeholder="Or write your own title"><button class="btn" id="crownBtn">Crown them</button>';
    }
  }else{
    h+='<p class="lede">'+esc(displayName(w))+' is choosing your title. Brace yourself.</p>';
  }
  h+='<div class="row"><button class="btn'+(crowned||!losers.length?'':' ghost')+'" id="againBtn">Play again</button><button class="btn ghost" id="lobbyBtn">Change seats</button></div>';
  $('winSheet').innerHTML=h;
  if(first){
    const cf=$('confetti');cf.innerHTML='';const cols=[COL.red.hex,COL.green.hex,COL.yellow.hex,COL.blue.hex,'#fff3dc'];
    for(let i=0;i<70;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%5];p.style.animationDuration=(2+Math.random()*2.5)+'s';p.style.animationDelay=(Math.random()*.8)+'s';cf.appendChild(p);}
    sfx.win();
  }
}
async function crown(title){

    h+='</div>';
  }

  if(!blocks.length)h+='<p class="note">No rolls yet.</p>';
  blocks.forEach(b=>{const tot=b[1].reduce((a,x)=>a+x,0)||1,mx=Math.max.apply(null,b[1])||1;

  h+='</div><div class="row"><button class="btn sm" id="recClose">Close</button></div>';
  $('recBox').innerHTML=h;$('recModal').hidden=false;
}

/* ================= lobby ================= */
function seatName(){return (nameIn.value||myName||'').trim().slice(0,18);}
let freeArm=null,freeT=null;
function drawLobby(){
  const mc=myColor(),act=(online==='live'&&uid&&canWrite!==false)||online==='solo';
  let h='';
  ORDER.forEach(c=>{
    const s=SEATS[c],mine=s&&s.uid===uid,taken=s&&!mine;
    const armed=taken&&freeArm===c;
    const who=mine?'You · tap to leave':(armed?'Tap again to free this seat':(taken?esc(s.name||'Someone')+(titleOf(s.uid)?' · '+esc(titleOf(s.uid)):''):(useBots?'Computer plays':'Tap to sit')));
    h+='<button class="seat'+(mine?' mine':'')+(taken?' taken':'')+(armed?' armed':'')+'" data-c="'+c+'" style="--c:'+COL[c].hex+'"'+(!act?' disabled':'')+'><span class="sw"></span><span><b>'+COL[c].ride+'</b><span>'+who+'</span></span></button>';
  });
  const se=$('seats');if(se.dataset.h!==h){se.dataset.h=h;se.innerHTML=h;}
  const humans=ORDER.filter(c=>SEATS[c]).length,total=useBots?4:humans;
  $('startBtn').disabled=!(mc&&total>=2&&act);
  $('nmLabel').classList.toggle('need',!seatName());
  let note;
  if(online==='solo')note='Could not reach the game server, so this is solo practice against the computer. Reload to try again. If it keeps happening, the server may be asleep: tell Faaiz.';
  else if(online==='connecting')note='Connecting...';
  else if(canWrite===false)note='Connecting...';
  else if(!seatName())note='Type your name, then pick a ride.';
  else if(!mc)note='Pick a ride. Anyone sitting down can start the game.';
  else note=humans===1?(useBots?'Start now against the computer, or wait for your siblings to sit down.':'Waiting for a sibling to sit down. Or set Empty seats to Computer to start now.'):humans+' of you are seated. Start when everyone is on the call.';
  $('lobbyNote').textContent=note;
}
$('seats').addEventListener('click',async e=>{
  const b=e.target.closest('.seat');if(!b||b.disabled)return;ac();
  if(!seatName()){toast('Type your name first.');nameIn.focus();return;}
  const c=b.dataset.c,mine=SEATS[c]&&SEATS[c].uid===uid;
  if(SEATS[c]&&!mine){
    /* someone else's seat: a second tap frees it, for when a sibling closed the app and left a ghost seat behind */
    if(freeArm!==c){freeArm=c;clearTimeout(freeT);freeT=setTimeout(()=>{freeArm=null;drawLobby();},3000);drawLobby();return;}
    freeArm=null;clearTimeout(freeT);
    if(online==='live'){try{await db.doc('seats/'+c).delete();}catch(err){toast('That did not save. Check your connection and try again.');}}
    else{delete SEATS[c];drawLobby();}
    return;
  }
  myName=seatName();try{localStorage.setItem('ld_name',myName);}catch(err){}
  if(online!=='live'){
    if(mine)delete SEATS[c];else{ORDER.forEach(o=>{if(SEATS[o]&&SEATS[o].uid===uid)delete SEATS[o];});SEATS[c]={uid:uid,name:myName,at:Date.now()};}
    drawLobby();return;
  }
  try{
    if(mine)await db.doc('seats/'+c).delete();
    else{for(const o of ORDER){if(SEATS[o]&&SEATS[o].uid===uid)await db.doc('seats/'+o).delete();}await db.doc('seats/'+c).set({uid:uid,name:myName,at:Date.now()});}
  }catch(err){toast('That did not save. Check your connection and try again.');}
});
nameIn.addEventListener('input',()=>{$('nmLabel').classList.toggle('need',!seatName());});
nameIn.addEventListener('change',async()=>{
  const v=seatName();if(!v)return;myName=v;try{localStorage.setItem('ld_name',myName);}catch(e){}
  const c=myColor();
  if(c&&online==='live'&&SEATS[c]){try{await db.doc('seats/'+c).update({name:myName});}catch(e){}}
  else if(c&&SEATS[c])SEATS[c].name=myName;
  drawLobby();
});
$('segMode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;$('segMode').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
$('segBots').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;useBots=b.dataset.b==='1';$('segBots').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));drawLobby();});
function startGame(order,players,n){
  const ti={};order.forEach(c=>{ti[c]=Array(n).fill(-1);});
  winKey='';pickTitle=TITLES[0];
  commit({status:'playing',gid:'g'+Date.now().toString(36),host:uid,order:order,players:players,tokens:ti,turn:order[0],phase:'roll',dice:6,sixes:0,rollSeq:0,finished:[],grudge:{},ledger:{},chat:{n:0},last:{kind:'start'}});
}
$('startBtn').addEventListener('click',()=>{
  ac();
  const players={},order=[];
  ORDER.forEach(c=>{
    if(SEATS[c])players[c]={uid:SEATS[c].uid,name:SEATS[c].name||COL[c].urdu,bot:false};
    else if(useBots)players[c]={bot:true,name:BOTN[c]||BOT_DEFAULT[c],uid:null};
    if(players[c])order.push(c);
  });
  if(order.length<2)return;
  const mc=myColor();const rot=order.indexOf(mc);
  startGame(rot>0?order.slice(rot).concat(order.slice(0,rot)):order,players,mode);
});

/* ================= input on the board ================= */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
$('gl').addEventListener('pointerdown',e=>{
  ac();
  const r=$('gl').getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const mc=myColor();if(!mc||G.status!=='playing'||G.turn!==mc||animating)return;
  if(G.phase==='roll'){if(ray.intersectObject(dice).length)doRoll();return;}
  const moves=legal(G,mc,G.dice);if(!moves.length)return;
  const hits=ray.intersectObjects(tokens[mc]||[],true);
  let pick=null;
  if(hits.length){const p=hits[0].object.userData.pawn;if(p&&moves.indexOf(p.userData.i)>=0)pick=p.userData.i;}
  const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-TOP),pt=new THREE.Vector3();
  const onBoard=ray.ray.intersectPlane(plane,pt);if(onBoard)board.worldToLocal(pt);
  if(pick===null&&onBoard){let best=1e9;moves.forEach(i=>{const d=tokens[mc][i].position.distanceTo(new THREE.Vector3(pt.x,TOP,pt.z));if(d<best&&d<1.1){best=d;pick=i;}});}
  // tapping the previewed landing square confirms the move
  if(sel!==null&&onBoard&&selInfo){const dw=g2w(selInfo.dest[0],selInfo.dest[1]);if(Math.hypot(pt.x-dw.x,pt.z-dw.z)<.75&&(pick===null||pick===sel)){const i=sel;setSel(null);doMove(i);return;}}
  if(pick===null){if(sel!==null)setSel(null);return;}
  const distinct=new Set(moves.map(i=>G.tokens[mc][i])).size>1;
  if(!distinct||sel===pick){setSel(null);doMove(pick);return;}
  setSel(pick);
});

/* ================= camera fit ================= */
let viewW=1,viewH=1;
const EL=56*Math.PI/180;
function fit(){
  viewW=Math.max(1,app.clientWidth);viewH=Math.max(1,app.clientHeight);
  renderer.setSize(viewW,viewH,false);camera.aspect=viewW/viewH;camera.clearViewOffset();
  const inGame=G.status==='playing'||G.status==='done';
  const stageH=inGame?0:(($('lobbyStage')&&$('lobbyStage').offsetHeight)||viewH*.34);
  const topUI=inGame?100:14,botUI=inGame?196:Math.max(0,viewH-stageH+6);
  const freeH=Math.max(120,viewH-topUI-botUI),freeW=viewW-20;
  const dir=new THREE.Vector3(0,Math.sin(EL),Math.cos(EL));
  let lo=10,hi=200;
  for(let it=0;it<30;it++){
    const d=(lo+hi)/2;camera.position.copy(dir).multiplyScalar(d);camera.lookAt(0,0,0);camera.updateMatrixWorld();camera.updateProjectionMatrix();
    measureBoard();
    if(boardRect.r-boardRect.l<=freeW&&boardRect.b-boardRect.t<=freeH)hi=d;else lo=d;
  }
  camera.position.copy(dir).multiplyScalar(hi);camera.lookAt(0,0,0);camera.updateMatrixWorld();camera.updateProjectionMatrix();
  measureBoard();
  const cy=(boardRect.t+boardRect.b)/2,want=topUI+freeH/2;
  camera.setViewOffset(viewW,viewH,0,cy-want,viewW,viewH);camera.updateProjectionMatrix();
  measureBoard();placeTags();
}
if(window.ResizeObserver)new ResizeObserver(fit).observe(app);else window.addEventListener('resize',fit);

(function(){const b=$('bokeh');const cols=['#f2b440','#e0352b','#2fbf9e','#ee5fa0','#2c6fe0'];let h='';for(let i=0;i<14;i++){const s=40+Math.random()*120;h+='<i style="left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;width:'+s+'px;height:'+s+'px;background:'+cols[i%5]+'"></i>';}b.innerHTML=h;})();

/* ================= frame loop ================= */
let last=performance.now(),lastInGame=null;
function frame(now){
  const t=now/1000;
  try{
    runTweens(now);
    const inGame=G.status==='playing'||G.status==='done';
    if(inGame!==lastInGame){lastInGame=inGame;fit();}
    if(!inGame){boardRot+=(now-last)/1000*.12;board.rotation.y=boardRot;}
    else{let d=boardRotTarget-boardRot;d=Math.atan2(Math.sin(d),Math.cos(d));boardRot+=d*Math.min(1,(now-last)/1000*4);board.rotation.y=boardRot;if(Math.abs(d)>.002)placeTags();}
    const mc=myColor();
    const mv=(G.status==='playing'&&G.turn===mc&&G.phase==='move'&&!animating)?legal(G,mc,G.dice):[];
    ORDER.forEach(c=>(tokens[c]||[]).forEach((p,i)=>{
      const on=c===mc&&mv.indexOf(i)>=0,picked=on&&sel===i;
      const r=p.userData.ring;r.material.opacity=picked?1:(on?(sel!==null?.3:.55+Math.sin(t*6)*.35):0);r.scale.setScalar(picked?1.12:(on?1+Math.sin(t*6)*.08:1));
      if(on)p.position.y=TOP+.1+Math.sin(t*6+i)*.07;else if(!tweens.length&&p.position.y!==TOP)p.position.y=TOP;
    }));
    if(G.status==='playing'&&G.phase==='roll'&&G.turn===mc&&!animating)dice.position.y=TOP+.5+Math.abs(Math.sin(t*3))*.18;
    if(preview.visible){
      pvPin.position.y=TOP+1.05+Math.sin(t*4)*.12;pvRing.scale.setScalar(1+Math.sin(t*5)*.06);
      pvPin.getWorldPosition(projV);projV.y+=.25;projV.project(camera);
      const pin=$('pin'),hw=pin.offsetWidth/2+8;pin.style.left=clamp((projV.x+1)/2*viewW,hw,viewW-hw)+'px';pin.style.top=Math.max(54,(1-projV.y)/2*viewH)+'px';
    }
    const pt=t-punchAt;camera.fov=32-(pt>=0&&pt<1.35?Math.sin(((pt%.45)/.45)*Math.PI)*7:0);camera.updateProjectionMatrix();
    renderer.render(scene,camera);
  }catch(e){if(!frame.err){frame.err=1;console.error(e);}}
  last=now;
  requestAnimationFrame(frame);
}

/* ================= backend: Supabase, no logins ================= */
const SB_URL='https://yjbvydkvrvyxkxcjizmq.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqYnZ5ZGt2cnZ5eGt4Y2ppem1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwOTQ3NTUsImV4cCI6MjExMDY3MDc1NX0.krKJt2MdwJsJ3ID9xILPHwGkFGrwUowZxCsLPLEIrgE';
const DEFAULT_ROOM='badla-4e5a70397a';
async function connectBackend(){
  const lib=window.supabase;
  if(!lib||!lib.createClient)return null;
  const hm=(location.hash||'').match(/r=([a-z0-9-]{4,40})/);
  const ROOM=hm?hm[1]:DEFAULT_ROOM;
  let uid=null;
  try{uid=localStorage.getItem('ld_uid');}catch(e){}
  if(!uid){
    uid='u'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>(b%36).toString(36)).join('');
    try{localStorage.setItem('ld_uid',uid);}catch(e){}
  }
  const sb=lib.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:10}}});
  const T='ld_docs';
  const cache={};            /* path -> data */
  const docSubs=[],colSubs=[];
  const bcast={};            /* topic -> [fn] */
  let ready=false,fails=0,errCb=null,writes=0;
  const clone=v=>JSON.parse(JSON.stringify(v));
  const snapDoc=p=>({exists:Object.prototype.hasOwnProperty.call(cache,p),data:()=>clone(cache[p]||{})});
  const snapCol=n=>({docs:Object.keys(cache).filter(k=>k.indexOf(n+'/')===0&&k.indexOf('/',n.length+1)<0).map(k=>({id:k.slice(n.length+1),data:()=>clone(cache[k])}))});
  function notify(paths){
    docSubs.forEach(s=>{if(!paths||paths.indexOf(s.p)>=0)try{s.cb(snapDoc(s.p));}catch(e){console.error(e);}});
    colSubs.forEach(s=>{if(!paths||paths.some(p=>p.indexOf(s.n+'/')===0))try{s.cb(snapCol(s.n));}catch(e){console.error(e);}});
  }
  const seqOf=v=>(v&&typeof v.seq==='number')?v.seq:null;
  function apply(path,data){ /* returns true if something changed */
    if(data===null){if(!(path in cache))return false;delete cache[path];return true;}
    /* never let an older game state replace a newer one */
    const a=seqOf(cache[path]),b=seqOf(data);if(a!==null&&b!==null&&b<a)return false;
    if(path in cache&&JSON.stringify(cache[path])===JSON.stringify(data))return false;
    cache[path]=data;return true;
  }
  async function pull(){
    const w0=writes;
    const {data,error}=await sb.from(T).select('path,data').eq('room',ROOM);
    if(error)throw error;
    if(writes!==w0)return []; /* a write landed while this read was in flight, so this read may be stale */
    const seen={},changed=[];
    data.forEach(r=>{seen[r.path]=1;if(apply(r.path,r.data))changed.push(r.path);});
    Object.keys(cache).forEach(p=>{if(!seen[p]){delete cache[p];changed.push(p);}});
    return changed;
  }
  async function poll(){
    try{const ch=await pull();fails=0;if(!ready){ready=true;notify(null);}else if(ch.length)notify(ch);}
    catch(e){fails++;if(fails===3&&errCb)errCb(e);}
  }
  /* one realtime channel carries both the live table changes and the quick reactions */
  const ch=sb.channel('ld-'+ROOM,{config:{broadcast:{self:false}}});
  ch.on('postgres_changes',{event:'*',schema:'public',table:T,filter:'room=eq.'+ROOM},p=>{
    try{
      const row=p.eventType==='DELETE'?p.old:p.new;if(!row||!row.path)return;
      if(apply(row.path,p.eventType==='DELETE'?null:row.data))notify([row.path]);
    }catch(e){console.error(e);}
  });
  ch.on('broadcast',{event:'react'},m=>{(bcast.react||[]).forEach(f=>{try{f({data:m.payload,sameTab:false});}catch(e){}});});
  ch.subscribe();
  await poll();
  if(!ready){await new Promise(r=>setTimeout(r,1500));await poll();}
  if(!ready){try{sb.removeChannel(ch);}catch(e){}return null;}
  setInterval(()=>{if(!document.hidden)poll();},3500);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
  const db={
    doc(path){return{
      async set(data){
        writes++;
        if(path==='ludo/game'){
          /* compare-and-set: the server only keeps it if it is newer than what is stored */
          let {data:ok,error}=await sb.rpc('ld_put_game',{p_room:ROOM,p_path:path,p_data:clone(data)});
          if(error&&(error.code==='PGRST202'||error.code==='42883')){
            const r=await sb.from(T).upsert({room:ROOM,path:path,data:clone(data),updated_at:new Date().toISOString()});
            error=r.error;ok=!r.error;
          }
          writes++;if(error)throw error;
          if(ok){if(apply(path,clone(data)))notify([path]);}else poll();
          return;
        }
        const {error}=await sb.from(T).upsert({room:ROOM,path:path,data:clone(data),updated_at:new Date().toISOString()});
        writes++;if(error)throw error;if(apply(path,clone(data)))notify([path]);
      },
      async update(part){
        writes++;
        const next=Object.assign({},cache[path]||{},clone(part));
        const {error}=await sb.from(T).upsert({room:ROOM,path:path,data:next,updated_at:new Date().toISOString()});
        writes++;if(error)throw error;if(apply(path,next))notify([path]);
      },
      async delete(){
        writes++;
        const {error}=await sb.from(T).delete().eq('room',ROOM).eq('path',path);
        writes++;if(error)throw error;if(apply(path,null))notify([path]);
      },
      onSnapshot(cb,err){if(err)errCb=err;docSubs.push({p:path,cb:cb});if(ready)cb(snapDoc(path));}
    };},
    collection(n){return{onSnapshot(cb,err){if(err)errCb=err;colSubs.push({n:n,cb:cb});if(ready)cb(snapCol(n));}};}
  };
  const room={
    emit(topic,data){return Promise.resolve(ch.send({type:'broadcast',event:topic,payload:data})).catch(()=>{});},
    on(topic,fn){(bcast[topic]=bcast[topic]||[]).push(fn);}
  };
  return{db:db,room:room,uid:uid,roomCode:ROOM};
}

async function boot(){
  let be=null;
  try{be=await Promise.race([connectBackend(),new Promise(r=>setTimeout(()=>r(null),9000))]);}catch(e){console.error(e);}
  if(be){db=be.db;room=be.room;uid=be.uid;canWrite=true;}
  if(!db||!uid){goSolo();return;}
  online='live';
  const lost=()=>{toast('Lost the connection. Reload to rejoin.');};
  db.collection('seats').onSnapshot(q=>{SEATS={};q.docs.forEach(d=>{const v=d.data();if(v&&v.uid)SEATS[d.id]=v;});tagsEl.dataset.h='';refreshUI();},lost);
  db.doc('ludo/botnames').onSnapshot(s=>{BOTN=s.exists?Object.assign({},s.data()):{};tagsEl.dataset.h='';refreshUI();},lost);
  db.doc('ludo/titles').onSnapshot(s=>{TITLES_BY=s.exists?Object.assign({},s.data()):{};winKey='';tagsEl.dataset.h='';refreshUI();},lost);
  db.collection('stats').onSnapshot(q=>{const n={};q.docs.forEach(d=>{n[d.id]=d.data();});if(statsDraft)n[uid]=statsDraft;STATS=n;},lost);
  db.doc('ludo/game').onSnapshot(s=>{G=s.exists?s.data():{status:'lobby'};if(!G.status)G.status='lobby';onGame();},lost);
  if(room){room.on('react',m=>{if(m.sameTab)return;const d=m.data||{};if(typeof d.i==='number'&&REACTS[d.i]&&COL[d.c])bubble(d.c,REACTS[d.i]);},()=>{});}
  setInterval(engine,2000);
  setInterval(checkSkip,3000);
  refreshUI();
}
/* a sibling whose phone fell asleep can be skipped after 45 seconds of nothing happening */
function checkSkip(){
  const b=$('skip'),p=G.players&&G.players[G.turn];
  const show=G.status==='playing'&&!!myColor()&&!!p&&!auto(p)&&p.uid!==uid&&Date.now()-changedAt>45000;
  if(b.hidden===show)b.hidden=!show;
  if(show)b.textContent='Let the computer drive for '+displayName(G.turn);
}

  const s=JSON.parse(JSON.stringify(G));s.players[c].away=true;s.last={kind:'away',color:c};
  $('skip').hidden=true;changedAt=Date.now();commit(s);
});
function goSolo(){online='solo';uid='me';refreshUI();}
window.__ld={sel:()=>sel,pin:()=>$('pin').hidden?'':$('pin').textContent,tokenScreen:(c,i)=>{const v=new THREE.Vector3();tokens[c][i].getWorldPosition(v);v.y+=.3;v.project(camera);return [(v.x+1)/2*viewW,(1-v.y)/2*viewH];},G:()=>G,setG:s=>{G=s;onGame();},doRoll:doRoll,doMove:doMove,legal:legal,myColor:myColor,animating:()=>animating,rollDie:rollDie,crown:crown,STATS:()=>STATS};
fit();refreshUI();
requestAnimationFrame(frame);
boot();
}
